version = 1

SPDX-PackageName = "erfana"
SPDX-PackageSupplier = "Qodeca sp. z o.o."
SPDX-PackageDownloadLocation = "https://github.com/qodeca/erfana-skills"

# REUSE specification (https://reuse.software/spec-3.3/) coverage for files that
# cannot carry an inline SPDX header (markdown with line-1 frontmatter, JSON,
# binary assets). Scripts carry inline `SPDX-License-Identifier` headers instead
# and are not annotated here. Per-asset overrides (e.g. a future CC0-licensed asset)
# are added as more specific [[annotations]] blocks with precedence = "closest".

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Qodeca sp. z o.o."
SPDX-License-Identifier = "GPL-3.0-only"

# Third-party: the handoff skill is adapted from mattpocock/skills (MIT).
# REUSE.toml uses the last matching annotation, so these entries replace the
# catch-all above for the files they name. Provenance:
# skills/handoff/references/UPSTREAM.md.
[[annotations]]
path = "skills/handoff/SKILL.md"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Matt Pocock", "2026 Qodeca sp. z o.o."]
SPDX-License-Identifier = "MIT AND GPL-3.0-only"

[[annotations]]
path = [
    "skills/handoff/references/LICENSE-upstream.txt",
    "skills/handoff/references/handoff-guide.md",
    "skills/handoff/references/phase-boundaries.md",
    "skills/handoff/references/claude-handoff-variant.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matt Pocock"
SPDX-License-Identifier = "MIT"
