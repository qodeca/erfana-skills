name: Verify plugin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Python deps
        run: pip install pyyaml 'reuse==5.1.1'
      - name: Run verification gates
        run: bash scripts/run-all-gates.sh
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests (strict)
        env:
          DISABLE_AUTOUPDATER: '1'
        run: claude plugin validate . --strict
      - name: Generated host table is in sync
        # scripts/gen-hosts-table.sh says "running this must produce no diff",
        # and nothing checked it - so a hand-edited install command or "how it
        # consumes" cell survived. Gate 15 only compares the version string.
        run: |
          set -euo pipefail
          bash scripts/gen-hosts-table.sh
          if ! git diff --quiet -- docs/hosts.md; then
            echo "::error::docs/hosts.md is out of sync with scripts/_lib/host_matrix.py - run bash scripts/gen-hosts-table.sh"
            git --no-pager diff -- docs/hosts.md
            exit 1
          fi
          echo "host table in sync"
      - name: REUSE license-metadata compliance
        run: reuse lint
      - name: Doc count guard (README agent count matches agents/*.md)
        # Single source of truth = the filesystem. If an agent is added or
        # removed without updating the "NN shared agents" claim in README.md,
        # this fails loudly instead of letting the count drift silently.
        run: |
          set -euo pipefail
          [ -d agents ] || { echo "::error::agents/ directory missing"; exit 1; }
          AGENTS=$(find agents -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          if ! grep -qE "(^|[^0-9])${AGENTS} shared agents" README.md; then
            echo "::error::README.md does not state '${AGENTS} shared agents' but agents/ has ${AGENTS} *.md files — update the count."
            exit 1
          fi
          echo "agent count in sync: ${AGENTS}"

  # Documentation checks: links (lychee), house style (vale), Markdown
  # structure (markdownlint-cli2). Configuration lives in lychee.toml,
  # .vale.ini + .vale/styles/, and .markdownlint-cli2.jsonc; the runner is
  # scripts/check-docs.sh, the same command maintainers run locally.
  # Local links and #fragments block the merge. Web links are checked in a
  # second, non-blocking step, because a third-party site being down must not
  # red-light develop; its failures are still printed in the log.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install lychee and vale (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lychee-dl"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/lychee-dl"
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          find "$RUNNER_TEMP/lychee-dl" -name lychee -type f -exec mv {} "$RUNNER_TEMP/lychee" \;
          "$RUNNER_TEMP/lychee" --version && "$RUNNER_TEMP/vale" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Docs checks (local links, style, Markdown) – blocking
        run: bash scripts/check-docs.sh --offline
      - name: Web links – reported, not blocking
        continue-on-error: true
        run: lychee --no-progress --config lychee.toml -- $(git ls-files -- '*.md' ':!skills/article/templates/*' ':!tests/skill/fixtures/*')

  # Cross-host: prove the plugin still converts and loads on Qwen Code.
  # A separate job from `gates` so a Qwen-side breakage is diagnosable at a
  # glance and can be de-required without weakening the main gate suite.
  #
  # The pin is deliberate and Gate 15 enforces it against
  # scripts/_lib/host_matrix.py: the alias tables and frontmatter rules in that
  # module were transcribed out of this exact bundle, so testing a different
  # Qwen would certify a version nobody read. The weekly qwen-canary workflow
  # is what moves the pin forward.
  qwen-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Qwen Code (pinned)
        run: npm install -g --ignore-scripts @qwen-code/qwen-code@0.22.3
      # The converted-agent frontmatter check needs a YAML parser, and it is the
      # only thing proving Qwen did not silently drop an agent's frontmatter -
      # the count check passes on file count alone. It ran today only because
      # the runner image happens to ship PyYAML in system python; do not rely on
      # that. The smoke test also hard-fails on a missing parser under --require.
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Qwen install + conversion smoke test
        run: bash scripts/qwen-smoke.sh --require

  # Windows is the only place the .ps1 hooks actually execute. On ubuntu, Gate
  # 14 can merely tokenize them; here Git Bash is present, dispatch.sh takes its
  # MINGW branch, and Gate 16 replays the fixtures through PowerShell.
  #
  # Scoped to Gate 16, not run-all-gates.sh: there is no claude CLI and no
  # reuse here, and Gate 18 needs full git history. The exec-bit assertions are
  # no-ops on NTFS.
  powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hook fixtures through the PowerShell implementations
        run: bash scripts/gate-16-hook-fixtures.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full git history)
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="--all" --redact -v
      - name: trufflehog (full git history, verified secrets)
        run: |
          version=3.95.5
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/trufflehog_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trufflehog
          "$RUNNER_TEMP/trufflehog" --version
          "$RUNNER_TEMP/trufflehog" git "file://$PWD" --results=verified --fail --no-update
